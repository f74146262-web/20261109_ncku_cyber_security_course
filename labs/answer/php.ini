; PHP2Shell lab configuration for the Moodle container.
;
; The global values are the public PoC's request-startup preconditions:
; 8M / 1000 / display_errors=On.  /index.php keeps them for startup; its
; config.php raises memory_limit to 256M before Moodle loads, and Apache gives
; every other PHP page a 256M / 5000 / display_errors=Off override.
;
; This is a deliberate lab compromise, not a production configuration.

display_errors = On
display_startup_errors = On
error_reporting = E_ALL

memory_limit = 8M
max_input_vars = 1000
post_max_size = 64M
upload_max_filesize = 64M

session.save_path = "/tmp"
session.use_strict_mode = 0
session.use_cookies = 1
session.upload_progress.enabled = On
session.upload_progress.cleanup = On

opcache.enable = 1
