# Apache settings for the single-container Moodle lab.
#
# The public PoC needs a single prefork worker: the dangling session state
# lives in one worker process.  This makes the whole Moodle site single-worker
# for the duration of the lab.
#
# The global PHP ini is the PoC's 8M / 1000 / display_errors=On.
# /index.php is deliberately excluded from the override below, so its request
# startup keeps those exact values.  config.php then raises memory_limit to
# 256M at runtime, so Moodle can render and reach shutdown where stage 3 runs.
# Every other PHP page gets a normal 256M / 5000 / display_errors=Off budget.

KeepAlive Off

<IfModule mpm_prefork_module>
    StartServers           1
    MinSpareServers        1
    MaxSpareServers        1
    MaxRequestWorkers      1
    ServerLimit            1
    MaxConnectionsPerChild 0
</IfModule>

<LocationMatch "^/(?!index\.php$).*\.php$">
    php_value memory_limit 256M
    php_value max_input_vars 5000
    php_value display_errors Off
    php_value display_startup_errors Off
</LocationMatch>
